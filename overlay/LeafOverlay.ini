; LeafOverlay.ini  —  configuration for the Leaf it Alone native overlay example mod.
; This file sits next to version.dll in the game folder. Edit it and relaunch the
; game; no recompiling needed. Every value below is optional (shown with defaults).

[overlay]
; Hotkey that shows/hides the overlay. Accepts F1-F24, a single letter/digit,
; or INSERT / HOME / END / SPACE / TAB.
ToggleKey = F9

; Which screen corner the panel is anchored to:
;   TopLeft | TopRight | BottomLeft | BottomRight
Corner = TopLeft

; Distance (pixels) from the anchored corner.
Margin = 22

; Panel opacity 1..255 (255 = fully solid, lower = more see-through).
Alpha = 235

; Which lines to show. true/false.
ShowTitle   = true
ShowClock   = true
ShowUptime  = true
; ShowMetrics: live in-game runtime values (the game process's RAM + CPU%).
ShowMetrics = true

; The text. Title is the big line; Subtitle is the small green line.
Title    = Hello, world!
Subtitle = Leaf it Alone - native overlay

; ---------------------------------------------------------------------------
; [safebase] - M4 banner + preconditions. safe-base's install.ps1 writes this
; section with Enabled=true; the standalone overlay keeps it disabled so the
; cosmetic HUD works on its own.
; ---------------------------------------------------------------------------
[safebase]
; Turn the safe-base features on. Draws the persistent OFFLINE banner below
; and runs the startup preflight. Leave false for cosmetic-only use.
Enabled = false

; Draw the banner. When false the preflight still runs (and logs), but the
; banner does not appear.
Banner = true

; Where the banner sits: TopCenter (default) | TopLeft | TopRight | BottomCenter.
BannerCorner = TopCenter

; Distance (pixels) from the anchor edge.
BannerMargin = 14

; Optional override. If empty the built-in default
; "OFFLINE - MODDED PLAY - SCORES WILL NOT BE SUBMITTED" is used.
; (Note: this ini is read as ANSI, so non-ASCII overrides need the file
; saved as UTF-16 LE.)
BannerText =

; Individual precondition toggles. All default true.
CheckSteamProxy    = true
CheckSaveIsolation = true
CheckOutbound      = true

; Expected byte size of the game's steam_api64.dll when the proxy is
; installed. safe-base's install.ps1 fills this in from the proxy it just
; placed. 0 disables the size comparison (path existence is still checked).
ExpectedSteamProxySize = 0

; Timeout (milliseconds) for the outbound connect() probe, 100..5000.
ProbeTimeoutMs = 1500

; ---------------------------------------------------------------------------
; [bageditor] - M8 in-game bag-capacity editor (safe-base mode only). A panel,
; hidden by default, toggled by ToggleKey. It edits the bag-capacity config with
; the arrow keys and, on Enter, saves it + launches apply-on-exit.ps1 so the new
; sizes are applied the next time you launch the game. It only reads/writes that
; small JSON file - never game memory.
; ---------------------------------------------------------------------------
[bageditor]
; Master switch for the panel.
Enabled = true

; Key that shows/hides the editor panel (F1-F24, a letter/digit, INSERT/HOME/END/SPACE/TAB).
ToggleKey = F8

; Panel offset (px) from the top-right corner.
Margin = 14

; Clamp range for a bag value.
MinValue = 1
MaxValue = 1000000

; Up/Down step; Shift uses StepBig.
Step    = 10
StepBig = 100

; The editor reads/writes %LOCALAPPDATA%\LeafItAloneSafe\bag-capacity.json by
; default - an ABSOLUTE path, so it works even if the game and your Windows
; profile are on different drives (a DLL-relative path would not). Leave
; ConfigPath unset unless you want a different ABSOLUTE location.
; Inside the panel: Left/Right pick a bag, Up/Down change the value, Enter saves.
; ConfigPath = C:\some\other\place\bag-capacity.json

